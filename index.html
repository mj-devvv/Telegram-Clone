<!DOCTYPE html>
<!--
  Static shell. PERF: no render-blocking JS (type=module is deferred by spec); CSS is one
  render-blocking request, which is desired to avoid FOUC. All dynamic content is created
  by src/ui/renderer.js via createElement + textContent only (no innerHTML anywhere).
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Telegram Web (Vanilla)</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Chats">
      <header class="sidebar__top">
        <input id="search" class="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search chats">
        <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle theme">◐</button>
      </header>
      <div id="offline-banner" class="banner" hidden>Waiting for network…</div>
      <ul id="chat-list" class="chat-list"></ul>
    </aside>
    <main class="chat" aria-label="Conversation">
      <header class="chat__header">
        <button id="back-btn" class="icon-btn back" type="button" aria-label="Back">←</button>
        <div class="chat__heading">
          <h2 id="chat-title" class="chat__title"></h2>
          <p id="chat-status" class="chat__status"></p>
        </div>
      </header>
      <div id="timeline" class="timeline" role="log" aria-live="polite"></div>
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Write a message…" aria-label="Message"></textarea>
        <button id="send-btn" class="send" type="submit" aria-label="Send">➤</button>
      </form>
    </main>
  </div>
</body>
</html>
